version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: rural-healthcare-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: rural_healthcare
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    build:
      context: ./backend
    container_name: rural-healthcare-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: mysql+asyncmy://app_user:app_password@mysql:3306/rural_healthcare
      CORS_ORIGINS: "http://localhost:5173"
    ports:
      - "8000:8000"
    depends_on:
      - mysql
    volumes:
      - ./backend:/app

volumes:
  mysql_data:
